
name: Build ABHI AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ABHI_AI_Groq_Ready_Source.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source archive
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Groq-ready source
        run: unzip ABHI_AI_Groq_Ready_Source.zip -d source

      - name: Add ABHI AI logo
        run: |
          mkdir -p source/ABHI_AI_V1/android/app/src/main/res/drawable
          curl -fL "https://raw.githubusercontent.com/m4911832/ABHI-AI-ANDROID/main/file_000000009adc82118946f503cf8c98ff.png" -o source/ABHI_AI_V1/android/app/src/main/res/drawable/abhi_ai_logo.png

      - name: Set ABHI AI as app icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("source/ABHI_AI_V1/android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          match = re.search(r'<application\b[^>]*>', s, re.S)
          if not match:
              raise SystemExit("Application tag not found")
          tag = match.group(0)
          tag = re.sub(r'\s+android:icon="[^"]+"', '', tag)
          tag = re.sub(r'\s+android:roundIcon="[^"]+"', '', tag)
          tag = tag[:-1] + ' android:icon="@drawable/abhi_ai_logo" android:roundIcon="@drawable/abhi_ai_logo">'
          s = s[:match.start()] + tag + s[match.end():]
          p.write_text(s)
          print("ABHI AI app icon configured")
          PY

      - name: Configure Render backend URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/ABHI_AI_V1/android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Android build file not found")
          s = p.read_text()
          old = "http://10.0.2.2:8787"
          new = "https://abhi-ai-android.onrender.com"
          if old in s:
              p.write_text(s.replace(old, new))
              print("Backend URL updated")
          elif new in s:
              print("Render URL already configured")
          else:
              raise SystemExit("Backend URL pattern not found")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p source/ABHI_AI_V1/android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABHI-AI-debug-APK
          path: source/ABHI_AI_V1/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
