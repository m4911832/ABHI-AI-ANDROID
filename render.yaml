services:
  - type: web
    name: abhi-ai-backend
    runtime: node
    rootDir: ABHI_AI_V1/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
